name: AppForge Android Cloud Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'My App'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.appforge.myapp'
      app_url:
        description: 'Website URL'
        required: true
        default: 'https://google.com'
      build_format:
        description: 'Output Format (apk or aab)'
        required: true
        default: 'apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare App Configuration
        run: |
          echo "Building App: ${{ github.event.inputs.app_name }}"
          echo "Package ID: ${{ github.event.inputs.package_id }}"
          echo "Target URL: ${{ github.event.inputs.app_url }}"
          echo "Format: ${{ github.event.inputs.build_format }}"
