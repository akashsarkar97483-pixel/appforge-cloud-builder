name: AppForge Android Cloud Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'My App'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.appforge.myapp'
      app_url:
        description: 'Website URL (Optional)'
        required: false
        default: ''
      html_code:
        description: 'Offline HTML App Code'
        required: false
        default: ''
      icon_url:
        description: 'App Logo Image URL (Optional)'
        required: false
        default: ''
      build_format:
        description: 'Output Format (apk or aab)'
        required: true
        default: 'apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create Capacitor Android App
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          mkdir www
          node -e '
            const fs = require("fs");
            const code = process.env.HTML_CODE || "";
            if (code.trim().length > 0) {
              fs.writeFileSync("www/index.html", code);
            } else {
              fs.writeFileSync("www/index.html", "<html><body><h3>Loading...</h3></body></html>");
            }
          '
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_id }}" --web-dir www
          node -e '
            const fs = require("fs");
            const code = process.env.HTML_CODE || "";
            const url = process.env.APP_URL || "";
            const cfg = {
              appId: process.env.PKG_ID,
              appName: process.env.APP_NAME,
              webDir: "www"
            };
            if (code.trim().length === 0 && url.trim().length > 0) {
              cfg.server = { url: url, cleartext: true };
            }
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          npx cap add android
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PKG_ID: ${{ github.event.inputs.package_id }}
          APP_URL: ${{ github.event.inputs.app_url }}
          HTML_CODE: ${{ github.event.inputs.html_code }}

      - name: Apply Custom App Logo
        run: |
          cd app
          mkdir -p assets
          if [ -n "${{ github.event.inputs.icon_url }}" ]; then
            curl -L "${{ github.event.inputs.icon_url }}" -o assets/icon.png || true
          fi
          if [ ! -s assets/icon.png ]; then
            node -e '
              const fs = require("fs");
              const zlib = require("zlib");
              const w = 512, h = 512;
              const raw = Buffer.alloc((w * 4 + 1) * h);
              for (let y = 0; y < h; y++) {
                raw[y * (w * 4 + 1)] = 0;
                for (let x = 0; x < w; x++) {
                  const idx = y * (w * 4 + 1) + 1 + x * 4;
                  const dx = x - 256, dy = y - 256;
                  const dist = Math.sqrt(dx * dx + dy * dy);
                  if (dist < 140 && dist > 95) {
                    raw[idx] = 255; raw[idx+1] = 255; raw[idx+2] = 255; raw[idx+3] = 255;
                  } else {
                    raw[idx] = 29; raw[idx+1] = 78; raw[idx+2] = 216; raw[idx+3] = 255;
                  }
                }
              }
              function crc32(buf) {
                let c = ~0;
                for (let i = 0; i < buf.length; i++) {
                  c ^= buf[i];
                  for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xedb88320 & -(c & 1));
                }
                return (~c) >>> 0;
              }
              function chunk(type, data) {
                const len = Buffer.alloc(4); len.writeUInt32BE(data.length);
                const t = Buffer.from(type);
                const crc = Buffer.alloc(4); crc.writeUInt32BE(crc32(Buffer.concat([t, data])));
                return Buffer.concat([len, t, data, crc]);
              }
              const ihdr = Buffer.alloc(13);
              ihdr.writeUInt32BE(w, 0); ihdr.writeUInt32BE(h, 4);
              ihdr[8] = 8; ihdr[9] = 6;
              const png = Buffer.concat([
                Buffer.from([137,80,78,71,13,10,26,10]),
                chunk("IHDR", ihdr),
                chunk("IDAT", zlib.deflateSync(raw)),
                chunk("IEND", Buffer.alloc(0))
              ]);
              fs.writeFileSync("assets/icon.png", png);
            '
          fi
          npx capacitor-assets generate --android --iconBackgroundColor '#1D4ED8'

      - name: Build Android APK or AAB
        run: |
          cd app/android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_format }}" = "aab" ]; then
            ./gradlew bundleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload Generated App File
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-build
          path: |
            app/android/app/build/outputs/apk/debug/*.apk
            app/android/app/build/outputs/bundle/release/*.aab
