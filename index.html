<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppForge AI - Offline APK & App Maker</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --border: #232e47;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 40px; }
    header {
      background: #0f1523; border-bottom: 1px solid var(--border);
      padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10;
    }
    .brand { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; background: #1e293b; color: #38bdf8; padding: 3px 8px; border-radius: 99px; border: 1px solid #334155; }
    .btn-sm { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .container { max-width: 640px; margin: 18px auto; padding: 0 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    h2 { margin: 0 0 12px; font-size: 16px; color: #e2e8f0; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
    input, textarea, select {
      width: 100%; background: #090d16; border: 1px solid var(--border); color: var(--text);
      padding: 11px 12px; border-radius: 10px; font-size: 14px; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    textarea { min-height: 150px; font-family: monospace; font-size: 12px; line-height: 1.4; }
    .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      background: #1e293b; border: 1px solid #334155; color: #cbd5e1;
      padding: 7px 11px; border-radius: 9px; font-size: 12px; cursor: pointer; font-weight: 600;
    }
    .chip.active { background: #1d4ed8; border-color: #60a5fa; color: #fff; }
    .btn-primary {
      width: 100%; margin-top: 16px; background: linear-gradient(135deg, #6366f1, #2563eb);
      color: #fff; border: none; padding: 14px; border-radius: 11px; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .btn-primary:active { transform: scale(0.99); }
    .status { margin-top: 14px; padding: 12px; border-radius: 10px; background: #0f172a; border: 1px solid #334155; font-size: 13px; line-height: 1.5; }
    .hidden { display: none; }
    .logo-preview { display: flex; align-items: center; gap: 12px; margin-top: 10px; background: #090d16; padding: 10px; border-radius: 10px; border: 1px solid var(--border); }
    .logo-box { width: 48px; height: 48px; border-radius: 12px; background: #1d4ed8; display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; flex-shrink: 0; }
    .logo-box img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

<header>
  <div class="brand">⚡ AppForge AI <span class="badge">OFFLINE + LOGO</span></div>
  <button class="btn-sm" onclick="toggleSettings()">⚙️ Setup</button>
</header>

<div class="container">
  <!-- GitHub Settings -->
  <div id="settingsBox" class="card hidden">
    <h2>🔑 GitHub Cloud Engine Setup</h2>
    <label>GitHub Username</label>
    <input id="ghUser" placeholder="akashsarkar97483-pixel" />
    <label>Repository Name</label>
    <input id="ghRepo" placeholder="appforge-cloud-builder" />
    <label>GitHub Token (ghp_...)</label>
    <input id="ghToken" type="password" placeholder="ghp_xxxxxxxxxxxx" />
    <button class="btn-primary" style="margin-top:12px;padding:10px;" onclick="saveSettings()">💾 Save Settings</button>
  </div>

  <!-- Main App Builder -->
  <div class="card">
    <h2>📱 नया ऑफलाइन Android ऐप बनाएं</h2>

    <label>1. ऐप का नाम (App Name)</label>
    <input id="appName" value="QuickEdit Pro" placeholder="जैसे: QuickEdit Pro" />

    <label>2. पैकेज आईडी (Package ID)</label>
    <input id="pkgName" value="com.akash.quickedit" placeholder="com.akash.myapp" />

    <label>3. ऐप का होम स्क्रीन लोगो (App Logo)</label>
    <div class="preset-row">
      <button type="button" class="chip active" onclick="setLogoPreset('', this)">🔵 Royal Ring (Default)</button>
      <button type="button" class="chip" onclick="setLogoPreset('https://cdn-icons-png.flaticon.com/512/1159/1159633.png', this)">📝 Code Editor Icon</button>
      <button type="button" class="chip" onclick="setLogoPreset('https://cdn-icons-png.flaticon.com/512/2991/2991148.png', this)">📘 Note Pad Icon</button>
    </div>
    <input id="iconUrl" style="margin-top:8px;" placeholder="या अपना लोगो इमेज लिंक (PNG) यहाँ पेस्ट करें (खाली छोड़ने पर नीला लोगो लगेगा)" oninput="updateLogoPreview()" />
    <div class="logo-preview">
      <div class="logo-box" id="logoPreviewBox">🔵</div>
      <div style="font-size:12px;color:#94a3b8;">यह लोगो आपके फोन की होम स्क्रीन पर ऐप आइकन के रूप में दिखेगा।</div>
    </div>

    <label>4. ऐप का कोड (Offline HTML/JS Code)</label>
    <div class="preset-row">
      <button type="button" class="chip" style="background:#065f46;border-color:#10b981;color:#ecfdf5;" onclick="loadQuickEditTemplate()">✨ QuickEdit जैसा कोड भरें</button>
      <button type="button" class="chip" onclick="document.getElementById('htmlCode').value=''">🗑️ साफ़ करें</button>
    </div>
    <textarea id="htmlCode" placeholder="यहाँ अपने ऐप का HTML/CSS/JS कोड पेस्ट करें या ऊपर 'QuickEdit जैसा कोड भरें' बटन दबाएं..."></textarea>

    <label>5. वेबसाइट लिंक (सिर्फ़ तब भरें जब ऊपर कोड बॉक्स खाली हो)</label>
    <input id="appUrl" placeholder="उदाहरण: https://example.com (ऑफलाइन ऐप के लिए खाली छोड़ें)" />

    <label>6. आउटपुट फ़ॉर्मेट चुनें</label>
    <select id="buildType">
      <option value="apk">Android APK (सीधे फोन में इंस्टॉल के लिए)</option>
      <option value="aab">Play Store Bundle (AAB)</option>
    </select>

    <button class="btn-primary" onclick="startBuild()">🚀 असली Android APK बनाएं</button>
    <div id="buildStatus" class="status hidden"></div>
  </div>
</div>

<script>
  window.onload = () => {
    document.getElementById('ghUser').value = localStorage.getItem('gh_user') || 'akashsarkar97483-pixel';
    document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || 'appforge-cloud-builder';
    document.getElementById('ghToken').value = localStorage.getItem('gh_tok') || '';
    loadQuickEditTemplate();
  };

  function toggleSettings() {
    document.getElementById('settingsBox').classList.toggle('hidden');
  }

  function saveSettings() {
    localStorage.setItem('gh_user', document.getElementById('ghUser').value.trim());
    localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
    localStorage.setItem('gh_tok', document.getElementById('ghToken').value.trim());
    alert('✅ GitHub Settings सेव हो गई हैं!');
    toggleSettings();
  }

  function setLogoPreset(url, btn) {
    document.querySelectorAll('.preset-row .chip').forEach(c => c.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById('iconUrl').value = url;
    updateLogoPreview();
  }

  function updateLogoPreview() {
    const url = document.getElementById('iconUrl').value.trim();
    const box = document.getElementById('logoPreviewBox');
    if (url) {
      box.innerHTML = `<img src="${url}" onerror="this.parentElement.innerHTML='🔵'" />`;
    } else {
      box.innerHTML = '🔵';
    }
  }

  function loadQuickEditTemplate() {
    const quickEditCode = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickEdit Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
  body { background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column; height: 100vh; }
  .toolbar { background: #252526; padding: 10px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid #3c3c3c; align-items: center; }
  .title { font-weight: bold; color: #4fc1ff; margin-right: auto; font-size: 15px; }
  button { background: #0e639c; color: #fff; border: none; padding: 7px 11px; border-radius: 5px; font-size: 12px; font-weight: bold; }
  button.sec { background: #3a3d41; }
  button.run { background: #16825d; }
  .filebar { background: #2d2d2d; padding: 6px 10px; font-size: 12px; color: #9cdcfe; display: flex; justify-content: space-between; border-bottom: 1px solid #3c3c3c; }
  textarea { flex: 1; width: 100%; background: #1e1e1e; color: #e2e8f0; border: none; padding: 12px; font-size: 14px; line-height: 1.5; outline: none; resize: none; }
  .statusbar { background: #007acc; color: #fff; padding: 5px 10px; font-size: 11px; display: flex; justify-content: space-between; }
  #previewModal { display: none; position: fixed; inset: 0; background: #fff; z-index: 99; flex-direction: column; }
  #previewBar { background: #111; color: #fff; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
  iframe { flex: 1; border: none; width: 100%; }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="title">📝 QuickEdit Pro</span>
    <button class="sec" onclick="newFile()">New</button>
    <button class="sec" onclick="openFile()">Open</button>
    <button onclick="saveFile()">Save</button>
    <button class="run" onclick="runCode()">▶ Run</button>
  </div>
  <div class="filebar">
    <span id="fileName">untitled.html</span>
    <span id="saveMsg">Saved</span>
  </div>
  <textarea id="editor" oninput="updateStats()" placeholder="Yahan apna HTML, CSS, JavaScript ya text likhein..."><!DOCTYPE html>
<html>
<body style="font-family:sans-serif;text-align:center;padding:30px;">
  <h2 style="color:#2563eb;">Hello Akash!</h2>
  <p>Yeh aapka apna QuickEdit Pro offline app hai.</p>
</body>
</html></textarea>
  <div class="statusbar">
    <span id="stats">Lines: 1 | Chars: 0</span>
    <span>UTF-8 | Offline Ready</span>
  </div>
  <input type="file" id="fileInput" style="display:none" onchange="loadSelectedFile(event)" />
  <div id="previewModal">
    <div id="previewBar">
      <span>Live Output Preview</span>
      <button style="background:#dc2626;" onclick="closePreview()">✕ Close</button>
    </div>
    <iframe id="previewFrame"></iframe>
  </div>
<script>
  const ed = document.getElementById('editor');
  const saved = localStorage.getItem('qe_saved_code');
  if (saved) ed.value = saved;
  updateStats();

  function updateStats() {
    const val = ed.value;
    const lines = val.split('\\n').length;
    document.getElementById('stats').innerText = 'Lines: ' + lines + ' | Chars: ' + val.length;
    localStorage.setItem('qe_saved_code', val);
    document.getElementById('saveMsg').innerText = 'Auto-Saved';
  }
  function newFile() {
    if (confirm('Nayi file shuru karein?')) {
      ed.value = '';
      document.getElementById('fileName').innerText = 'new_file.txt';
      updateStats();
    }
  }
  function openFile() { document.getElementById('fileInput').click(); }
  function loadSelectedFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('fileName').innerText = file.name;
    const reader = new FileReader();
    reader.onload = ev => { ed.value = ev.target.result; updateStats(); };
    reader.readAsText(file);
  }
  function saveFile() {
    const name = prompt('File ka naam likhein:', document.getElementById('fileName').innerText) || 'code.html';
    document.getElementById('fileName').innerText = name;
    const blob = new Blob([ed.value], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
  }
  function runCode() {
    document.getElementById('previewModal').style.display = 'flex';
    document.getElementById('previewFrame').srcdoc = ed.value;
  }
  function closePreview() {
    document.getElementById('previewModal').style.display = 'none';
  }
<\/script>
</body>
</html>`;
    document.getElementById('htmlCode').value = quickEditCode;
  }

  async function startBuild() {
    const appName = document.getElementById('appName').value.trim();
    const pkgName = document.getElementById('pkgName').value.trim();
    const htmlCode = document.getElementById('htmlCode').value;
    const appUrl = document.getElementById('appUrl').value.trim();
    const iconUrl = document.getElementById('iconUrl').value.trim();
    const buildType = document.getElementById('buildType').value;

    const st = document.getElementById('buildStatus');
    st.classList.remove('hidden');

    if (!appName || !pkgName || (!htmlCode.trim() && !appUrl)) {
      st.innerHTML = '⚠️ कृपया ऐप का नाम, पैकेज आईडी और ऑफलाइन कोड (या लिंक) भरें।';
      return;
    }

    const u = localStorage.getItem('gh_user') || 'akashsarkar97483-pixel';
    const r = localStorage.getItem('gh_repo') || 'appforge-cloud-builder';
    const t = localStorage.getItem('gh_tok');

    if (!t) {
      st.innerHTML = '⚙️ पहले ऊपर <strong>Setup</strong> बटन दबाकर अपना GitHub Token सेव करें।';
      toggleSettings();
      return;
    }

    st.innerHTML = '⏳ <strong>Cloud Builder</strong> को आपका ऑफलाइन कोड और लोगो भेजा जा रहा है...';

    try {
      const res = await fetch(`https://api.github.com/repos/${u}/${r}/actions/workflows/build_android.yml/dispatches`, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + t,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          ref: 'main',
          inputs: {
            app_name: appName,
            package_id: pkgName,
            app_url: appUrl,
            html_code: htmlCode,
            icon_url: iconUrl,
            build_format: buildType
          }
        })
      });

      if (res.status === 204) {
        st.innerHTML = `🚀 <strong>बिल्ड शुरू हो गया है!</strong><br>लगभग 2 मिनट में आपका लोगो वाला <strong>${appName}</strong> APK तैयार हो जाएगा।<br><br><a href="https://github.com/${u}/${r}/actions" target="_blank" style="display:inline-block;background:#10b981;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:bold;">📥 यहाँ से APK डाउनलोड करें (Actions खोलें)</a>`;
      } else {
        const err = await res.json();
        st.innerHTML = `❌ सर्वर त्रुटि (${res.status}): ${err.message || 'Check Token'}`;
      }
    } catch (e) {
      st.innerHTML = '❌ नेटवर्क या कनेक्शन त्रुटि।';
    }
  }
</script>
</body>
</html>
